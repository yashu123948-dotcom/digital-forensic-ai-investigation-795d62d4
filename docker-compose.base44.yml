services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      # keep container node_modules from leaking onto the host bind-mount
      - node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npx vite dev --port 3000 --host 0.0.0.0 --strictPort"
    ports:
      - "3000:3000"
    environment:
      # Vite >= 6.1 appends this to allowedHosts so the preview origin is accepted
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
    env_file:
      - ./.env
      - /run/base44/app.env
    restart: unless-stopped

volumes:
  node_modules:
